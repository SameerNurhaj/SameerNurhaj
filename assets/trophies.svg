<svg width="760" height="170" viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#150826"/><stop offset="100%" stop-color="#2b0a3d"/>
  </linearGradient>
  <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="cardClip"><rect width="760" height="170" rx="18"/></clipPath>
  <style>
    <![CDATA[
    .trophy { transform-box: fill-box; transform-origin: 50% 100%;
      animation-name: popIn; animation-duration: 0.55s; animation-timing-function: cubic-bezier(.24,1.4,.4,1); animation-fill-mode: both; }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.6) translateY(16px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .shine { animation-name: shineMove; animation-duration: 2.4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    @keyframes shineMove { 0% { transform: translateX(-20px); opacity: 0; } 15% { opacity: 1; } 55% { transform: translateX(180px); opacity: 1; } 65% { opacity: 0; } 100% { opacity: 0; transform: translateX(180px); } }
    ]]>
  </style>
</defs>
